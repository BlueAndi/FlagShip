ekf_filter_node:
  ros__parameters:
    # The frequency, in Hz, at which the filter will output a position estimate.
    # The filter starts after first measurement, then runs continuously at this rate.
    # Defaults to 30 if unspecified.
    frequency: 20.0

    # ekf_localization_node and ukf_localization_node both use a 3D
    # omnidirectional motion model. If set to true, no 3D information is used.
    # Use this for planar environments.
    # Defaults to false if unspecified.
    two_d_mode: true

    # Whether to broadcast the transformation over the /tf topic.
    # Defaults to true if unspecified.
    publish_tf: true

    # Whether to publish the acceleration state.
    # Defaults to false if unspecified.
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Odometry from Wheel encoders
    odom0: odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false, 
                   false, false, true, 
                   false, false, false]
    odom0_differential: false
    odom0_relative: true
    odom0_queue_size: 10

    # IMU 
    imu0: imu
    imu0_config: [false, false, false,
                  false, false, false,  
                  false, false, false,
                  false, false, true,
                  true,  false, false] 
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: false
