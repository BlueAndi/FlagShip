ekf_filter_node:
  ros__parameters:
    # The frequency, in Hz, at which the filter will output a position estimate.
    # The filter starts after first measurement, then runs continuously at this rate.
    # Defaults to 30 if unspecified.
    frequency: 30.0

    # ekf_localization_node and ukf_localization_node both use a 3D
    # omnidirectional motion model. If set to true, no 3D information is used.
    # Use this for planar environments.
    # Defaults to false if unspecified.
    two_d_mode: true

    # Whether to broadcast the transformation over the /tf topic.
    # Defaults to true if unspecified.
    publish_tf: true

    # Whether to publish the acceleration state.
    # Defaults to false if unspecified.
    publish_acceleration: false

    # 1. Set map_frame, odom_frame, and base_link frames for your system.
    # 1a. If your system has no map frame, remove map_frame and use world_frame=odom_frame.
    # 2. For continuous local data (wheel odom, visual odom, IMU), set world_frame=odom_frame.
    # 3. For global absolute data with jumps (GPS, landmarks):
    # 3a. Set world_frame=map_frame.
    # 3b. Ensure something else generates odom->base_link.
    map_frame: map              # Defaults to "map" if unspecified
    odom_frame: odom            # Defaults to "odom" if unspecified
    base_link_frame: base_footprint  # Defaults to "base_link" if unspecified
    world_frame: odom           # Defaults to the value of odom_frame if unspecified

    # Odometry from tcp_bridge
    odom0: odom
    odom0_config: [true, true, false,
                   false, false, true,
                   true, false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # IMU from tcp_bridge
    imu0: imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  true, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: false
